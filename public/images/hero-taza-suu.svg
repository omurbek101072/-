<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fa8e6"/>
      <stop offset="0.55" stop-color="#a9d4f2"/>
      <stop offset="1" stop-color="#e8f4fb"/>
    </linearGradient>
    <radialGradient id="sun" cx="1500" cy="250" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffbe6" stop-opacity="1"/>
      <stop offset="0.18" stop-color="#fff3c4" stop-opacity=".9"/>
      <stop offset="1" stop-color="#fff3c4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="farMtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fa9c4"/>
      <stop offset="1" stop-color="#b8cde0"/>
    </linearGradient>
    <linearGradient id="midMtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b7f8f"/>
      <stop offset="1" stop-color="#7fa3a2"/>
    </linearGradient>
    <linearGradient id="hill1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fb069"/>
      <stop offset="1" stop-color="#5e9a4f"/>
